name: Java build

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Java 8 compatible sources
        run: mkdir -p build && find src/main/java -name '*.java' -print0 | xargs -0 javac -source 8 -target 8 -d build
